<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Электронная очередь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row .form-group {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #5a67d8;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
        }
        .required {
            color: #e53e3e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Регистрация студента</h1>
        <div class="form-card">
            <form method="POST">
                <div class="form-group">
                    <label>Логин <span class="required">*</span></label>
                    <input type="text" name="username" required placeholder="Придумайте логин">
                </div>
                <div class="form-group">
                    <label>Пароль <span class="required">*</span></label>
                    <input type="password" name="password" required placeholder="Придумайте пароль">
                </div>
                <div class="form-group">
                    <label>ФИО полностью <span class="required">*</span></label>
                    <input type="text" name="fullname" required placeholder="Иванов Иван Иванович">
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Группа <span class="required">*</span></label>
                        <select name="group" required>
                            <option value="">Выберите группу</option>
                            <option value="ФМ-11-22">ФМ-11-22</option>
                            <option value="ФМ-12-22">ФМ-12-22</option>
                            <option value="ФМ-12-23">ФМ-12-23</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Подгруппа <span class="required">*</span></label>
                        <select name="subgroup" required>
                            <option value="">Выберите подгруппу</option>
                            <option value="1">1 подгруппа</option>
                            <option value="2">2 подгруппа</option>
                        </select>
                    </div>
                </div>
                <button type="submit">Зарегистрироваться</button>
            </form>
            <div class="login-link">
                <a href="/login">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </div>
</body>
</html>
